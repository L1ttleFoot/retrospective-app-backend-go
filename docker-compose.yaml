services:
  go-app:
    container_name: backend
    build: .
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT}

      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      REDIS_USER: ${REDIS_USER}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}

      ADDR: ${ADDR}
      LOGGER_LEVEL: ${LOGGER_LEVEL}
    depends_on:
      - postgres_db
      - redis_cache
    ports: 
      - "8080:8080"
      - "8081:8081"
  
  postgres_db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    #env_file:
    #  - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7.2-alpine
    container_name: redis_cache
    restart: unless-stopped
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
  
  db-migrate:
    image: migrate/migrate:v4.19.1
    container_name: db-migrate
    volumes:
      - ./migrations:/migrations
    # - ${PROJECT_ROOT}/migrations:/migrations абсолютный путь если Make файл в другой дериктории  
     
  retro-frontend:
    build: ../retrospective-app
    container_name: frontend
    ports: 
      - "3000:80"
    depends_on:
      - go-app

volumes:
  postgres_data:
  redis_data: