services:
  go-app:
    container_name: backend
    build: .
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT}
      ADDR: ${ADDR}
      LOGGER_LEVEL: ${LOGGER_LEVEL}
    depends_on:
      - postgres_db
    ports: 
      - "8080:8080"
  
  postgres_db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    #env_file:
    #  - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  db-migrate:
    image: migrate/migrate:v4.19.1
    container_name: db-migrate
    volumes:
      - ./migrations:/migrations
    # - ${PROJECT_ROOT}/migrations:/migrations абсолютный путь если Make файл в другой дериктории  
     
  retro-frontend:
    build: ../retrospective-app
    container_name: frontend
    ports: 
      - "3000:80"
    depends_on:
      - go-app

volumes:
  postgres_data: