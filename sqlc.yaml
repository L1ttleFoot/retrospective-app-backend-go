version: "2"
cloud:
    organization: ""
    project: ""
    hostname: ""
servers: []
sql:
  - engine: "postgresql"
    schema: "migrations"                                   # golang-migrate: *.down.sql игнорируется
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          # Порядок важен: nullable-правило первым
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "uuid"
            go_type: "string"          # в domain ID везде string
overrides:
    go: null
plugins: []
rules: []
options: {}